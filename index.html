<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>AI 讨论地图 · 静态演示</title>
<style>
:root {
  --brand: #FF8200;
  --brandstrong: #F46200;
  --text: #333333;
  --secondary: #636363;
  --muted: #939393;
  --link: #546992;
  --line: #E6E6E6;
  --soft: #F8F8F8;
  --surface: #FFFFFF;
  --stage: #636363;
  font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
  color: var(--text);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--stage); font-weight: 400; }
button, input, textarea, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .55; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.stage { min-height: 100vh; display: flex; justify-content: center; }
.phone-shell {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  padding-bottom: 84px;
  background: var(--surface);
}

/* 考试演示控制台：默认收起，避免占用正文首屏 */
.exam-tools { padding: 0 14px; background: #FFF9F3; border-bottom: .5px solid var(--line); }
.exam-tools-toggle {
  width: 100%;
  min-height: 38px;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  border: 0;
  background: transparent;
  text-align: left;
}
.demo-label { color: var(--brandstrong); font-size: 12px; font-weight: 500; }
.demo-status { margin-left: auto; color: var(--muted); font-size: 11px; font-weight: 400; }
.exam-tools-chevron { width: 14px; color: var(--muted); font-size: 18px; line-height: 18px; text-align: right; }
.exam-tools-panel { padding: 0 0 10px; }
.tool-row { display: flex; gap: 10px; }
.tool-row label { flex: 1; min-width: 0; color: var(--secondary); font-size: 12px; }
.tool-row select {
  display: block;
  width: 100%;
  min-height: 34px;
  margin-top: 4px;
  padding: 0 8px;
  border: .5px solid var(--line);
  border-radius: 6px;
  background: #FFFFFF;
  color: var(--text);
  font-size: 12px;
}

/* 正文 */
.post-section { padding: 0 14px 8px; background: #FFFFFF; }
.author { height: 59px; display: flex; align-items: center; gap: 14px; }
.avatar {
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: .5px solid rgba(0, 0, 0, .05);
  border-radius: 50%;
  background: var(--soft);
  color: var(--secondary);
  font-size: 15px;
}
.author-meta { flex: 1; min-width: 0; }
.author-name {
  overflow: hidden;
  color: var(--brandstrong);
  font-size: 15px;
  line-height: 19px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.meta {
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  line-height: 18px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.author-tag {
  padding: 5px 9px;
  border: .5px solid var(--brand);
  border-radius: 14px;
  color: var(--brand);
  font-size: 11px;
  white-space: nowrap;
}
.post-body {
  margin: 4px 0 12px;
  overflow-wrap: anywhere;
  font-size: 16px;
  line-height: 23px;
  white-space: pre-wrap;
}
.post-actions {
  height: 45px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  border-top: .5px solid var(--line);
}
.post-actions button {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 0;
  background: none;
  color: var(--secondary);
  font-size: 12px;
}
.section-gap { height: 10px; background: #F5F5F5; }

/* 评论区导航 */
.discussion-section { background: #FFFFFF; }
.comment-tabs {
  position: sticky;
  top: 0;
  z-index: 9;
  height: 44px;
  display: flex;
  align-items: stretch;
  gap: 20px;
  padding: 0 14px;
  border-bottom: .5px solid var(--line);
  background: #FFFFFF;
  color: var(--muted);
  font-size: 15px;
}
.comment-tabs > div { position: relative; display: flex; align-items: center; }
.comment-tabs .active { color: var(--text); font-weight: 500; }
.comment-tabs .active:after {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 24px;
  height: 3px;
  border-radius: 9px;
  background: linear-gradient(90deg, #FEB500, #FE9500);
  content: '';
  transform: translateX(-50%);
}

/* AI 讨论地图 */
.map-wrap { margin: 10px 14px 13px; overflow: hidden; border: .5px solid var(--line); border-radius: 8px; background: #FFFFFF; }
.map-toggle {
  width: 100%;
  min-height: 50px;
  padding: 10px 11px;
  display: flex;
  align-items: center;
  gap: 9px;
  border: 0;
  background: #FFFFFF;
  text-align: left;
}
.map-symbol { width: 22px; flex: 0 0 22px; }
.map-toggle-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.map-toggle-text strong { font-size: 14px; font-weight: 500; line-height: 17px; }
.map-toggle-text small { color: var(--muted); font-size: 11px; line-height: 15px; }
.chevron { color: var(--muted); font-size: 22px; line-height: 16px; }
.map-state { padding: 14px; border-top: .5px solid var(--line); color: var(--muted); font-size: 12px; line-height: 19px; }
.map-tree { padding: 10px 10px 10px; border-top: .5px solid var(--line); }
.map-center {
  width: 92%;
  margin: auto;
  padding: 7px 10px;
  border: .5px solid rgba(255, 130, 0, .4);
  border-radius: 8px;
  background: rgba(255, 130, 0, .08);
  text-align: center;
}
.map-center small { display: block; margin-bottom: 3px; color: var(--brandstrong); font-size: 11px; }
.map-center strong { font-size: 14px; font-weight: 500; line-height: 21px; }
.tree-lines { display: block; width: 100%; height: 22px; }
.topic-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.topic {
  min-height: 44px;
  padding: 6px 4px;
  border: .5px solid var(--line);
  border-radius: 6px;
  background: var(--soft);
  color: var(--text);
  font-size: 12px;
  line-height: 17px;
  text-align: center;
  overflow-wrap: anywhere;
}
.topic.selected { border-color: var(--brand); background: rgba(255, 130, 0, .08); color: var(--brandstrong); }
.map-footnote { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 16px; text-align: center; }
.preview { margin-top: 8px; padding: 9px 11px; border-radius: 6px; background: var(--soft); }
.preview-title { margin: 0 0 5px; font-size: 12px; font-weight: 500; }
.preview-focus { margin: 0 0 7px; color: var(--secondary); font-size: 12px; line-height: 18px; }
.quote-author { margin-bottom: 3px; color: var(--secondary); font-size: 12px; }
.quote-body {
  display: -webkit-box;
  overflow: hidden;
  margin: 0;
  font-size: 14px;
  line-height: 20px;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}
.preview-actions { display: flex; justify-content: flex-end; padding-top: 5px; }
.preview-actions button { padding: 6px 0; border: 0; background: none; color: var(--link); font-size: 12px; }
.map-warning { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 16px; }

/* 原评论与按需搜索 */
.comments-heading {
  padding: 0 14px 9px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.comments-heading strong { font-size: 14px; font-weight: 500; }
.comments-heading-actions { display: flex; align-items: center; gap: 8px; }
.comments-heading-actions > span { color: var(--muted); font-size: 12px; }
.comment-search-toggle {
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--secondary);
}
.comment-search-toggle.open { background: var(--soft); color: var(--brandstrong); }
.comment-search { padding: 9px 14px 12px; background: var(--soft); }
.comment-search label { color: var(--secondary); font-size: 12px; }
.search-line { display: flex; gap: 8px; margin-top: 7px; }
.search-line input {
  flex: 1;
  min-width: 0;
  padding: 9px;
  border: .5px solid var(--line);
  border-radius: 8px;
  background: #FFFFFF;
  font-size: 12px;
}
.search-line button, .comment-composer button {
  padding: 0 12px;
  border: 0;
  border-radius: 7px;
  background: var(--brand);
  color: #FFFFFF;
  font-size: 12px;
}
.search-result { color: var(--secondary); font-size: 12px; line-height: 19px; }
.search-result button { display: block; padding: 7px 0; border: 0; background: none; color: var(--link); font-size: 12px; text-align: left; }

/* 原生评论 */
.comment-list { padding: 0 14px; }
.comment { display: flex; gap: 14px; padding: 13px 0; border-bottom: .5px solid var(--line); scroll-margin-top: 52px; }
.comment .avatar { width: 42px; height: 42px; }
.comment-info { flex: 1; min-width: 0; }
.comment-name { color: var(--secondary); font-size: 14px; line-height: 18px; }
.comment-text { margin: 6px 0 8px; overflow-wrap: anywhere; font-size: 15px; line-height: 22px; white-space: pre-wrap; }
.comment-meta { color: var(--muted); font-size: 12px; line-height: 18px; }
.comment.highlight { margin-right: -14px; margin-left: -14px; padding-right: 14px; padding-left: 14px; background: rgba(255, 130, 0, .12); }
.comment-composer { margin: 12px 14px; padding-top: 12px; border-top: .5px solid var(--line); }
.comment-composer label { display: block; margin-bottom: 7px; font-size: 13px; }
.comment-composer label span { color: var(--muted); font-size: 11px; }
.comment-composer textarea { width: 100%; min-height: 64px; padding: 9px; border: .5px solid var(--line); border-radius: 6px; font-size: 13px; line-height: 21px; resize: vertical; }
.comment-composer button { height: 30px; margin-top: 5px; }
.demo-comment-list { padding: 0 14px; }

/* 固定底部互动栏 */
.bottom-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  z-index: 11;
  width: min(430px, 100%);
  height: 72px;
  padding-bottom: env(safe-area-inset-bottom, 0);
  display: flex;
  align-items: center;
  justify-content: space-around;
  transform: translateX(-50%);
  border-top: .5px solid var(--line);
  background: #FFFFFF;
}
.bottom-bar button {
  min-width: 78px;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  border: 0;
  background: none;
  color: var(--text);
  font-size: 13px;
}
.bottom-bar button.active { color: var(--brandstrong); }
.toast {
  position: fixed;
  bottom: 91px;
  left: 50%;
  z-index: 99;
  width: max-content;
  max-width: min(380px, 90%);
  padding: 11px 15px;
  transform: translateX(-50%);
  border-radius: 8px;
  background: rgba(51, 51, 51, .95);
  color: #FFFFFF;
  font-size: 12px;
}

@media (max-width: 430px) {
  body { background: #FFFFFF; }
  .phone-shell { max-width: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
}

/* 静态演示按钮 */
.action-icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.post-actions button[aria-pressed="true"], .bottom-bar button[aria-pressed="true"] { color: var(--brandstrong); }
.back-top { margin-top: 8px; padding: 4px 0; border: 0; background: none; color: var(--link); font-size: 12px; }
</style>
</head>
<body>
<div class="stage">
  <main class="phone-shell" aria-label="AI 讨论地图静态演示">
    <section class="exam-tools" aria-label="演示设置">
      <button class="exam-tools-toggle" id="settings" type="button" aria-expanded="false" aria-controls="controls">
        <span class="demo-label">考试演示</span>
        <span class="demo-status">示例快照 · 仅在浏览器保存</span>
        <span id="settings-arrow" class="exam-tools-chevron" aria-hidden="true">⌄</span>
      </button>
      <div class="exam-tools-panel" id="controls" hidden>
        <div class="tool-row">
          <label>内容场景<select id="scenario"><option value="garden">社区花园</option><option value="reading">周末阅读角</option></select></label>
          <label>体验身份<select id="identity"><option value="A">访客 A</option><option value="B">访客 B</option></select></label>
        </div>
        <button class="back-top" type="button" id="top">返回顶部</button>
      </div>
    </section>
    <article class="post-section" id="post">
      <div class="author">
        <span id="post-avatar" class="avatar" aria-hidden="true">示</span>
        <div class="author-meta"><div id="post-author" class="author-name">示例发帖人</div><div id="post-time" class="meta">演示内容</div></div>
        <span id="post-title" class="author-tag">社区花园</span>
      </div>
      <p class="post-body" id="post-body"></p>
      <div class="post-actions">
        <button type="button" id="copy" aria-label="转发 · 复制演示链接">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6m0-6-8 8m8 1v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"/></svg>
          <span id="post-shares">0</span>
        </button>
        <button type="button" id="show-comments" aria-label="查看评论">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5h13A2.5 2.5 0 0 1 21 7.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 3v-3h-1A2.5 2.5 0 0 1 3 14.5v-7A2.5 2.5 0 0 1 5.5 5Z"/><path d="M8 11h.1m3.9 0h.1m3.9 0h.1"/></svg>
          <span id="post-comments-total">0</span>
        </button>
        <button type="button" id="post-like" aria-label="点赞" aria-pressed="false">
          <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10h2l3-6c.5-1 2.3-.7 2.5.8.1 1.3-.2 3.3-.7 4.7H19a2 2 0 0 1 1.9 2.6l-1.9 6a2 2 0 0 1-1.9 1.4H8m-3-10h3v10H5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z"/></svg>
          <span id="post-likes-total">0</span>
        </button>
      </div>
    </article>
    <div class="section-gap" aria-hidden="true"></div>
    <section class="discussion-section" id="discussion" aria-label="讨论区">
      <div class="comment-tabs"><div class="active">评论<span id="comment-total">0</span></div><div>赞</div><div>转发</div></div>
      <div class="map-wrap">
        <button id="map-toggle" class="map-toggle" type="button" aria-expanded="false" aria-controls="map-content">
          <span class="map-symbol" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3v5M10 8H4M10 8h6M4 8v5M16 8v5" stroke="#FF8200" stroke-width="1.7" stroke-linecap="round"/><circle cx="10" cy="3" r="2" fill="#FF8200"/><circle cx="4" cy="15" r="2" fill="#FF8200"/><circle cx="16" cy="15" r="2" fill="#FF8200"/></svg>
          </span>
          <span class="map-toggle-text"><strong>AI 讨论地图</strong><small id="map-hint"></small></span>
          <span id="map-arrow" class="chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="map-content" hidden></div>
      </div>
      <div class="comments-heading">
        <strong id="comment-title">原评论</strong>
        <div class="comments-heading-actions">
          <span id="comments-count"></span>
          <button class="comment-search-toggle" id="search-toggle" type="button" aria-label="搜索原评论" aria-expanded="false" aria-controls="search">
            <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"/><path d="m15.7 15.7 4.2 4.2"/></svg>
          </button>
        </div>
      </div>
      <form id="search" class="comment-search" hidden>
        <label for="query">搜索原评论</label>
        <div class="search-line"><input id="query" type="search" maxlength="40" placeholder="输入关键词查找原评论"><button type="submit">查找</button></div>
        <div id="search-results" class="search-result" aria-live="polite"></div>
      </form>
      <div id="comment-list" class="comment-list"></div>
      <form id="composer" class="comment-composer">
        <label for="comment-input">发表测试评论 <span>仅在当前浏览器保存</span></label>
        <textarea id="comment-input" rows="2" maxlength="400" placeholder="输入 2–400 个字" required></textarea>
        <button type="submit">发布测试评论</button>
      </form>
      <div id="local-comments" class="demo-comment-list"></div>
    </section>
    <footer class="bottom-bar">
      <button type="button" id="like" aria-label="喜欢" aria-pressed="false">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 10h2l3-6c.5-1 2.3-.7 2.5.8.1 1.3-.2 3.3-.7 4.7H19a2 2 0 0 1 1.9 2.6l-1.9 6a2 2 0 0 1-1.9 1.4H8m-3-10h3v10H5a1 1 0 0 1-1-1v-8a1 1 0 0 1 1-1Z"/></svg>
        <span id="like-label">喜欢</span>
      </button>
      <button type="button" id="write">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5h13A2.5 2.5 0 0 1 21 7.5v7a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 3v-3h-1A2.5 2.5 0 0 1 3 14.5v-7A2.5 2.5 0 0 1 5.5 5Z"/><path d="M8 11h.1m3.9 0h.1m3.9 0h.1"/></svg>评论
      </button>
      <button type="button" id="save" aria-pressed="false">☆ 收藏</button>
    </footer>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<template id="tree-connector">
  <svg class="tree-lines" viewBox="0 0 320 28" preserveAspectRatio="none" fill="none" aria-hidden="true"><path d="M160 0V12M52 12H268M52 12V28M160 12V28M268 12V28" stroke="#D6D6D6" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>
</template>
<noscript>启用 JavaScript 后，可展开讨论地图并体验评论互动。</noscript>
<script>
'use strict';

const scenarios = {
  garden: {
    title: '《社区花园》话题',
    author: '社区花园观察员',
    time: '2026年11月13日 15:05',
    shares: 8,
    paragraphs: [
      '#社区花园# 小区角落有一块闲置花坛。周末的邻里会上，大家提议把它改成共享花园，留出一条可供轮椅和婴儿车通行的步道。第一期先用现有的花盆和工具做个小样，等邻居走过、用过，再决定下一步。',
      '种什么、步道怎么留、浇水由谁负责？如果这个月只能先做一件事，你会选什么？欢迎在评论里聊聊。'
    ],
    likes: 24,
    question: '共享花园的第一期应该优先做什么？',
    comments: [
      ['晴窗', '先种薄荷和迷迭香吧，容易照顾，路过的人也可以闻到香味。', 12],
      ['晒太阳的小猫', '建议给步道留出连续的宽度，花盆不要挡在拐角。', 9],
      ['小纸船', '如果做浇水值班表，我可以认领周六。也可以在入口贴一份换班表。', 8],
      ['夜读者', '希望保留一段矮花坛，让小朋友也够得到。', 6],
      ['晨风', '步道最好选雨天不打滑的材料，推车经过也会方便些。', 4]
    ],
    branches: [
      ['种植选择', '从耐养护的香草开始，降低第一期种植难度。', 0],
      ['步道设计', '为轮椅和婴儿车保留连续、好走的通行空间。', 1],
      ['日常养护', '让愿意参与的住户认领浇水时段。', 2]
    ]
  },
  reading: {
    title: '《周末阅读角》话题',
    author: '阅读角志愿者',
    time: '2026年11月15日 10:20',
    shares: 2,
    paragraphs: [
      '邻里活动室计划增加一个周末阅读角，先摆一张小桌和两排书。靠窗的位置采光好，里面的角落比较安静。',
      '活动室准备下周试开一天，大家更喜欢哪个位置？'
    ],
    likes: 6,
    comments: [
      ['薄荷茶', '我选靠窗，上午读书不用开灯。', 3],
      ['晚霞', '里面的角落安静，适合放几本绘本。', 2]
    ]
  }
};

const $ = id => document.getElementById(id);
const storageKey = 'public-discussion-map-v1:' + location.pathname.replace(/index\.html$/, '');
let model = {};
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) model = saved;
} catch {}
const state = {
  scenario: Object.hasOwn(scenarios, model.scenario) ? model.scenario : 'garden',
  identity: model.identity === 'B' ? 'B' : 'A',
  expanded: false,
  branch: null,
  manual: false,
  readSeconds: 0
};
let toastTimer, highlightTimer;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function button(label, action, className) {
  const node = element('button', label, className);
  node.type = 'button';
  node.addEventListener('click', action);
  return node;
}

function notify(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(model));
    return true;
  } catch {
    notify('浏览器存储不可用，操作仅在本次访问中有效。');
    return false;
  }
}

function activity() {
  const key = state.scenario + '/' + state.identity;
  model.activities ||= {};
  model.activities[key] ||= { liked: false, saved: false, comments: [] };
  return model.activities[key];
}

function setDisclosure(toggle, panel, open) {
  $(toggle).setAttribute('aria-expanded', String(open));
  $(panel).hidden = !open;
}

function show(target, block = 'start') {
  const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  target.scrollIntoView({ behavior, block });
}

function renderReactions() {
  const current = activity();
  const total = scenarios[state.scenario].likes + Number(current.liked);
  for (const id of ['post-like', 'like']) {
    const target = $(id);
    target.setAttribute('aria-pressed', String(current.liked));
    target.setAttribute('aria-label', current.liked ? '取消点赞' : '点赞');
  }
  $('post-likes-total').textContent = total.toLocaleString('zh-CN');
  $('like-label').textContent = current.liked ? '已喜欢' : '喜欢';
  $('save').setAttribute('aria-pressed', String(current.saved));
  $('save').textContent = current.saved ? '★ 已收藏' : '☆ 收藏';
}

function renderComment(author, text, detail) {
  const item = element('article', undefined, 'comment');
  const avatar = element('span', author[0], 'avatar');
  avatar.setAttribute('aria-hidden', 'true');
  const body = element('div', undefined, 'comment-info');
  body.append(element('div', author, 'comment-name'), element('p', text, 'comment-text'),
    element('div', detail, 'comment-meta'));
  item.append(avatar, body);
  return item;
}

function renderLocalComments() {
  $('local-comments').replaceChildren(...activity().comments.map(text =>
    renderComment('访客 ' + state.identity, text, '本地测试评论')));
}

function jumpToComment(index) {
  const target = $('comment-' + index);
  if (!target) return;
  document.querySelector('.comment.highlight')?.classList.remove('highlight');
  target.focus({ preventScroll: true });
  show(target, 'center');
  target.classList.add('highlight');
  clearTimeout(highlightTimer);
  highlightTimer = setTimeout(() => target.classList.remove('highlight'), 2500);
}

function renderMap() {
  const scenario = scenarios[state.scenario];
  const content = $('map-content');
  setDisclosure('map-toggle', 'map-content', state.expanded);
  $('map-arrow').textContent = state.expanded ? '⌃' : '⌄';
  $('map-hint').textContent = scenario.branches ?
    '已整理 ' + scenario.branches.length + ' 个讨论方向' : '原评论不足 3 条';
  if (!state.expanded) return;
  if (!scenario.branches) {
    content.replaceChildren(element('p', '这个场景只有两条原评论，暂未整理讨论分支。', 'map-state'));
    return;
  }
  const tree = element('div', undefined, 'map-tree');
  const center = element('div', undefined, 'map-center');
  center.append(element('small', '大家在讨论'), element('strong', scenario.question));
  const topics = element('div', undefined, 'topic-grid');
  scenario.branches.forEach(([label], index) => {
    const topic = button(label, () => {
      state.branch = state.branch === index ? null : index;
      renderMap();
      $('topic-' + index).focus();
    }, state.branch === index ? 'topic selected' : 'topic');
    topic.id = 'topic-' + index;
    topic.setAttribute('aria-pressed', String(state.branch === index));
    topics.append(topic);
  });
  tree.append(center, $('tree-connector').content.cloneNode(true), topics);
  if (state.branch === null) {
    tree.append(element('p', '点击一个讨论分支，预览一条原评论。', 'map-footnote'));
  } else {
    const [label, focus, index] = scenario.branches[state.branch];
    const [author, quote] = scenario.comments[index];
    const preview = element('div', undefined, 'preview');
    const actions = element('div', undefined, 'preview-actions');
    actions.append(button('查看相关原评论 →', () => jumpToComment(index)));
    preview.append(element('p', label + ' · 代表性原评论', 'preview-title'),
      element('p', focus, 'preview-focus'), element('div', author, 'quote-author'),
      element('p', quote, 'quote-body'), actions);
    tree.append(preview);
  }
  tree.append(element('p', '讨论地图为静态示例，内容以原评论为准。', 'map-warning'));
  content.replaceChildren(tree);
}

function renderScenario() {
  const scenario = scenarios[state.scenario];
  $('post-title').textContent = scenario.title;
  $('post-author').textContent = scenario.author;
  $('post-avatar').textContent = scenario.author[0];
  $('post-time').textContent = scenario.time;
  $('post-body').textContent = scenario.paragraphs.join('\n');
  $('post-shares').textContent = scenario.shares.toLocaleString('zh-CN');
  $('post-comments-total').textContent = scenario.comments.length.toLocaleString('zh-CN');
  $('comment-total').textContent = $('post-comments-total').textContent;
  $('comments-count').textContent = '已载入 ' + scenario.comments.length + ' 条示例评论';
  $('comment-list').replaceChildren(...scenario.comments.map(([author, text, likes], index) => {
    const item = renderComment(author, text, '赞 ' + likes);
    item.id = 'comment-' + index;
    item.tabIndex = -1;
    return item;
  }));
  $('query').value = '';
  $('search-results').replaceChildren();
  $('comment-input').value = '';
  setDisclosure('search-toggle', 'search', false);
  $('search-toggle').classList.remove('open');
  state.expanded = false;
  state.branch = null;
  state.manual = false;
  state.readSeconds = 0;
  renderReactions();
  renderLocalComments();
  renderMap();
}

function toggleReaction(kind) {
  const current = activity();
  current[kind] = !current[kind];
  renderReactions();
  if (persist()) {
    const label = kind === 'liked' ? '点赞' : '收藏';
    notify((current[kind] ? '已' : '已取消') + label);
  }
}

$('scenario').value = state.scenario;
$('identity').value = state.identity;
$('settings').addEventListener('click', () => {
  const opening = $('controls').hidden;
  setDisclosure('settings', 'controls', opening);
  $('settings-arrow').textContent = opening ? '⌃' : '⌄';
});
$('scenario').addEventListener('change', event => {
  state.scenario = model.scenario = event.target.value;
  persist();
  renderScenario();
});
$('identity').addEventListener('change', event => {
  state.identity = model.identity = event.target.value;
  $('comment-input').value = '';
  renderReactions();
  renderLocalComments();
  if (persist()) notify('已切换为访客 ' + state.identity);
});
$('map-toggle').addEventListener('click', () => {
  state.manual = true;
  state.expanded = !state.expanded;
  renderMap();
});
$('search-toggle').addEventListener('click', () => {
  const opening = $('search').hidden;
  setDisclosure('search-toggle', 'search', opening);
  $('search-toggle').classList.toggle('open', opening);
  if (opening) $('query').focus();
});
$('search').addEventListener('submit', event => {
  event.preventDefault();
  const query = $('query').value.trim().toLowerCase();
  const results = $('search-results');
  if (!query) {
    results.textContent = '请输入关键词。';
    return;
  }
  const matches = [];
  scenarios[state.scenario].comments.forEach(([author, text], index) => {
    if ((author + ' ' + text).toLowerCase().includes(query)) {
      matches.push(button(author + '：' + text, () => jumpToComment(index)));
    }
  });
  results.replaceChildren(element('p', '找到 ' + matches.length + ' 条评论。'), ...matches);
});
$('composer').addEventListener('submit', event => {
  event.preventDefault();
  const input = $('comment-input');
  const text = input.value.trim();
  if (text.length < 2 || text.length > 400) {
    notify('请输入 2–400 个字。');
    input.focus();
    return;
  }
  activity().comments.push(text);
  renderLocalComments();
  input.value = '';
  if (persist()) notify('测试评论已保存在当前浏览器。');
});
for (const id of ['like', 'post-like']) $(id).addEventListener('click', () => toggleReaction('liked'));
$('save').addEventListener('click', () => toggleReaction('saved'));
$('show-comments').addEventListener('click', () => show($('discussion')));
$('write').addEventListener('click', () => {
  $('comment-input').focus({ preventScroll: true });
  show($('composer'), 'center');
});
$('top').addEventListener('click', () => show(document.querySelector('.exam-tools')));
$('copy').addEventListener('click', async () => {
  if (location.protocol !== 'https:') {
    notify('上线后可复制公开链接。');
    return;
  }
  try {
    await navigator.clipboard.writeText(location.origin + location.pathname);
    notify('已复制演示链接。');
  } catch {
    notify('请从地址栏复制演示链接。');
  }
});

renderScenario();
setInterval(() => {
  if (document.hidden || state.manual || state.expanded || !scenarios[state.scenario].branches) return;
  const bounds = $('post').getBoundingClientRect();
  if (bounds.bottom <= 100 || bounds.top >= innerHeight || $('discussion').getBoundingClientRect().top <= 210) return;
  if (++state.readSeconds >= 5) {
    state.expanded = true;
    renderMap();
  }
}, 1000);
</script>
</body>
</html>
