<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>讨论地图 · 静态演示</title>
<style>
:root{color-scheme:light;--paper:#fffdf9;--ink:#252238;--muted:#655e71;--line:#e9e1e1;--lavender:#f3eefc;--accent:#603c9c;--accent-deep:#49257f;--peach:#ffefe4}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f2eef6;color:var(--ink);font:16px/1.65 system-ui,"Microsoft YaHei",sans-serif}
button,select,input,textarea{font:inherit}
button,select{cursor:pointer}
button{min-height:42px}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #986bd8;outline-offset:3px}
button,input,textarea,select{border:1px solid var(--line);border-radius:10px}
button{color:var(--ink);background:var(--paper);padding:6px 12px}
button:hover{border-color:#aa89cf}
button[aria-pressed="true"]{background:var(--lavender);color:var(--accent-deep);border-color:#a581d0}
input,textarea,select{color:var(--ink);background:white;padding:8px 10px;min-width:0}
h1,h2,h3,p{margin:0}
.shell{max-width:670px;min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 12px 52px #35235416}
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 24px;background:#2e2343;color:#fff}
.header h1{font-size:19px;letter-spacing:.08em}
.header button{background:transparent;color:#fff;border-color:#785f97}
.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end;padding:14px 24px;background:var(--lavender)}
.controls label{flex:1 1 136px;font-size:13px;color:var(--muted)}
.controls select{display:block;width:100%;margin-top:4px}
.post,.discussion{padding:24px}
.post{border-bottom:1px solid var(--line)}
.author{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.avatar{display:grid;place-items:center;flex:0 0 38px;width:38px;height:38px;border-radius:14px;background:var(--peach);color:#7a3d21;font-weight:700}
.meta,.hint{color:var(--muted);font-size:13px}
.post h2{font-size:clamp(22px,5vw,28px);line-height:1.3;margin-bottom:10px}
.post p+p{margin-top:8px}
.post-buttons,.footer{display:flex;gap:8px;flex-wrap:wrap}
.post-buttons{margin-top:16px}
.discussion>h2{font-size:19px;margin-bottom:10px}
.map{margin-bottom:22px;border:1px solid #e0d1f2;border-radius:18px;overflow:hidden}
.map-toggle{display:flex;width:100%;text-align:left;align-items:center;gap:12px;padding:12px 14px;border:0;border-radius:0;background:var(--lavender)}
.map-toggle:focus-visible{outline-offset:-4px}
.map-mark{font-size:24px;color:var(--accent)}
.map-toggle small{display:block;color:var(--muted)}
.chevron{margin-left:auto;color:var(--accent);font-size:20px}
.map-content{padding:14px}
.question{background:#2e2343;color:white;border-radius:12px;padding:12px 14px;text-align:center;font-weight:650}
.branches{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:8px;margin:12px 0 8px}
.branches button{padding:5px;font-size:14px}
.branch-note{margin-top:8px;font-size:13px;color:var(--muted)}
.preview{padding:12px;margin-top:12px;background:var(--peach);border-radius:12px}
.preview p{margin:5px 0 8px}
.search-heading{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.search-heading h3{flex:1;font-size:16px}
.search{background:#f7f3fb;border-radius:12px;padding:12px;margin:10px 0}
.search label{display:block;font-size:14px;margin-bottom:4px}
.search-fields{display:flex;gap:8px}
.search-fields input{flex:1}
.search-results button{display:block;width:100%;text-align:left;margin:6px 0}
.search-results p{margin-top:8px}
.comment{display:flex;align-items:flex-start;gap:10px;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:8px;overflow-wrap:anywhere}
.comment .avatar{width:31px;height:31px;flex-basis:31px;font-size:13px;border-radius:10px;background:var(--lavender);color:var(--accent-deep)}
.comment strong{font-size:14px}
.comment p{margin-top:2px}
.comment.highlight{background:#fff0d8}
.composer{margin-top:21px}
.composer label{display:block;font-weight:650}
.composer textarea{display:block;width:100%;resize:vertical;margin:8px 0}
.primary{color:white;background:var(--accent-deep);border-color:var(--accent-deep)}
.primary:hover{background:var(--accent)}
.footer{position:sticky;bottom:0;z-index:1;padding:10px 24px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--paper)}
.footer button{flex:1;white-space:nowrap}
.toast{position:fixed;z-index:2;bottom:76px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);padding:8px 13px;background:#2e2343;color:#fff;border-radius:10px;text-align:center;font-size:14px}
@media(max-width:420px){.header,.controls,.post,.discussion,.footer{padding-left:15px;padding-right:15px}.footer button{padding-inline:5px}}
</style>
</head>
<body>
<main class="shell">
  <header class="header">
    <h1>讨论地图</h1>
    <button id="settings" type="button" aria-expanded="false" aria-controls="controls">切换场景</button>
  </header>
  <section id="controls" class="controls" aria-label="演示设置" hidden>
    <label>讨论场景<select id="scenario"><option value="garden">社区花园</option><option value="reading">周末阅读角</option></select></label>
    <label>体验身份<select id="identity"><option value="A">访客 A</option><option value="B">访客 B</option></select></label>
  </section>
  <article id="post" class="post">
    <div class="author">
      <span class="avatar" aria-hidden="true">帖</span>
      <div><strong>示例发帖人</strong><div class="meta">静态演示 · 帖子与原评论均为虚构内容</div></div>
    </div>
    <h2 id="post-title">社区花园的春季改造</h2>
    <div id="post-body"></div>
    <div class="post-buttons">
      <button type="button" id="copy">复制演示链接</button>
      <button type="button" id="show-comments">查看评论</button>
      <button type="button" id="post-like" aria-pressed="false">♡ 点赞</button>
    </div>
  </article>
  <section id="discussion" class="discussion" aria-labelledby="discussion-title">
    <h2 id="discussion-title">讨论区</h2>
    <div class="map">
      <button id="map-toggle" type="button" class="map-toggle" aria-expanded="false" aria-controls="map-content">
        <span class="map-mark" aria-hidden="true">⌘</span>
        <span><strong>讨论地图</strong><small id="map-hint"></small></span>
        <span class="chevron" id="map-arrow" aria-hidden="true">⌄</span>
      </button>
      <div id="map-content" class="map-content" hidden></div>
    </div>
    <div class="search-heading">
      <h3 id="comment-title">原评论</h3>
      <button type="button" id="search-toggle" aria-expanded="false" aria-controls="search">搜索评论</button>
    </div>
    <form id="search" class="search" hidden>
      <label for="query">关键词</label>
      <div class="search-fields"><input id="query" type="search" maxlength="40" placeholder="例如：步道"><button type="submit">查找</button></div>
      <div id="search-results" class="search-results" aria-live="polite"></div>
    </form>
    <div id="comment-list"></div>
    <form id="composer" class="composer">
      <label for="comment-input">写一条测试评论</label>
      <p class="hint">评论只保存在当前浏览器。</p>
      <textarea id="comment-input" rows="2" maxlength="400" placeholder="输入 2–400 个字" required></textarea>
      <button class="primary" type="submit">保存测试评论</button>
    </form>
    <div id="local-comments"></div>
  </section>
  <footer class="footer">
    <button type="button" id="like" aria-pressed="false">♡ 点赞</button>
    <button type="button" id="write">评论</button>
    <button type="button" id="save" aria-pressed="false">☆ 收藏</button>
    <button type="button" id="top">回顶部</button>
  </footer>
</main>
<div id="toast" class="toast" role="status" hidden></div>
<noscript>启用 JavaScript 后，可展开讨论地图并体验评论互动。</noscript>
<script>
'use strict';

const scenarios = {
  garden: {
    title: '社区花园的春季改造',
    paragraphs: [
      '小区角落有一块闲置花坛。周末的邻里会上，大家提议把它改成共享花园，留出一条能进轮椅和婴儿车的步道。',
      '第一期只够做三件事。种什么、步道怎么留、浇水由谁负责？欢迎在评论里说说你觉得最先该做什么。'
    ],
    likes: 24,
    question: '共享花园的第一期应该优先做什么？',
    comments: [
      ['晴窗', '先种薄荷和迷迭香吧，容易照顾，路过的人也可以闻到香味。', 12],
      ['晒太阳的小猫', '建议给步道留出连续的宽度，花盆不要挡在拐角。', 9],
      ['小纸船', '如果做浇水值班表，我可以认领周六。也可以在入口贴一份换班表。', 8],
      ['夜读者', '希望保留一段矮花坛，让小朋友也够得到。', 6],
      ['晨风', '步道最好选雨天不打滑的材料，推车经过也会方便些。', 4]
    ],
    branches: [
      ['种植选择', '从耐养护的香草开始，降低第一期种植难度。', 0],
      ['步道设计', '为轮椅和婴儿车保留连续、好走的通行空间。', 1],
      ['日常养护', '让愿意参与的住户认领浇水时段。', 2]
    ]
  },
  reading: {
    title: '周末阅读角选址',
    paragraphs: [
      '邻里活动室计划增加一个周末阅读角，先摆一张小桌和两排书。靠窗的位置采光好，里面的角落比较安静。',
      '活动室准备下周试开一天，大家更喜欢哪个位置？'
    ],
    likes: 6,
    comments: [
      ['薄荷茶', '我选靠窗，上午读书不用开灯。', 3],
      ['晚霞', '里面的角落安静，适合放几本绘本。', 2]
    ]
  }
};

const $ = id => document.getElementById(id);
const storageKey = 'public-discussion-map-v1:' + location.pathname.replace(/index\.html$/, '');
let model = {};
try {
  const saved = JSON.parse(localStorage.getItem(storageKey));
  if (saved && typeof saved === 'object' && !Array.isArray(saved)) model = saved;
} catch {}
const state = {
  scenario: Object.hasOwn(scenarios, model.scenario) ? model.scenario : 'garden',
  identity: model.identity === 'B' ? 'B' : 'A',
  expanded: false,
  branch: null,
  manual: false,
  readSeconds: 0
};
let toastTimer, highlightTimer;

function element(tag, text, className) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (className) node.className = className;
  return node;
}

function button(label, action, className) {
  const node = element('button', label, className);
  node.type = 'button';
  node.addEventListener('click', action);
  return node;
}

function notify(message) {
  const toast = $('toast');
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2600);
}

function persist() {
  try {
    localStorage.setItem(storageKey, JSON.stringify(model));
    return true;
  } catch {
    notify('浏览器存储不可用，操作仅在本次访问中有效。');
    return false;
  }
}

function activity() {
  const key = state.scenario + '/' + state.identity;
  model.activities ||= {};
  model.activities[key] ||= { liked: false, saved: false, comments: [] };
  return model.activities[key];
}

function setDisclosure(toggle, panel, open) {
  $(toggle).setAttribute('aria-expanded', String(open));
  $(panel).hidden = !open;
}

function show(target, block = 'start') {
  const behavior = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
  target.scrollIntoView({ behavior, block });
}

function renderReactions() {
  const current = activity();
  const total = scenarios[state.scenario].likes + Number(current.liked);
  for (const id of ['post-like', 'like']) {
    const target = $(id);
    target.setAttribute('aria-pressed', String(current.liked));
    target.textContent = (current.liked ? '♥ 已点赞' : '♡ 点赞') + (id === 'post-like' ? ' ' + total : '');
  }
  $('save').setAttribute('aria-pressed', String(current.saved));
  $('save').textContent = current.saved ? '★ 已收藏' : '☆ 收藏';
}

function renderComment(author, text, detail) {
  const item = element('article', undefined, 'comment');
  const avatar = element('span', author[0], 'avatar');
  avatar.setAttribute('aria-hidden', 'true');
  const body = element('div');
  body.append(element('strong', author), element('p', text), element('div', detail, 'meta'));
  item.append(avatar, body);
  return item;
}

function renderLocalComments() {
  $('local-comments').replaceChildren(...activity().comments.map(text =>
    renderComment('访客 ' + state.identity, text, '本地测试评论')));
}

function jumpToComment(index) {
  const target = $('comment-' + index);
  if (!target) return;
  document.querySelector('.comment.highlight')?.classList.remove('highlight');
  target.focus({ preventScroll: true });
  show(target, 'center');
  target.classList.add('highlight');
  clearTimeout(highlightTimer);
  highlightTimer = setTimeout(() => target.classList.remove('highlight'), 2500);
}

function renderMap() {
  const scenario = scenarios[state.scenario];
  const content = $('map-content');
  setDisclosure('map-toggle', 'map-content', state.expanded);
  $('map-arrow').textContent = state.expanded ? '⌃' : '⌄';
  $('map-hint').textContent = scenario.branches ?
    scenario.branches.length + ' 个讨论方向 · 示例整理' : '原评论不足 3 条';
  if (!state.expanded) return;
  if (!scenario.branches) {
    content.replaceChildren(element('p', '这个场景只有两条原评论，暂未整理讨论分支。', 'hint'));
    return;
  }
  const topics = element('div', undefined, 'branches');
  scenario.branches.forEach(([label], index) => {
    const topic = button(label, () => {
      state.branch = state.branch === index ? null : index;
      renderMap();
      $('topic-' + index).focus();
    });
    topic.id = 'topic-' + index;
    topic.setAttribute('aria-pressed', String(state.branch === index));
    topics.append(topic);
  });
  content.replaceChildren(element('p', scenario.question, 'question'), topics);
  if (state.branch === null) {
    content.append(element('p', '选择一个分支，预览代表性原评论。', 'branch-note'));
    return;
  }
  const [, focus, index] = scenario.branches[state.branch];
  const [author, quote] = scenario.comments[index];
  const preview = element('div', undefined, 'preview');
  preview.append(element('div', focus, 'hint'), element('p', author + '：' + quote),
    button('定位原评论 →', () => jumpToComment(index)));
  content.append(preview);
}

function renderScenario() {
  const scenario = scenarios[state.scenario];
  $('post-title').textContent = scenario.title;
  $('post-body').replaceChildren(...scenario.paragraphs.map(text => element('p', text)));
  $('comment-title').textContent = '原评论 · ' + scenario.comments.length + ' 条';
  $('comment-list').replaceChildren(...scenario.comments.map(([author, text, likes], index) => {
    const item = renderComment(author, text, '赞 ' + likes);
    item.id = 'comment-' + index;
    item.tabIndex = -1;
    return item;
  }));
  $('query').value = '';
  $('search-results').replaceChildren();
  $('comment-input').value = '';
  setDisclosure('search-toggle', 'search', false);
  state.expanded = false;
  state.branch = null;
  state.manual = false;
  state.readSeconds = 0;
  renderReactions();
  renderLocalComments();
  renderMap();
}

function toggleReaction(kind) {
  const current = activity();
  current[kind] = !current[kind];
  renderReactions();
  if (persist()) {
    const label = kind === 'liked' ? '点赞' : '收藏';
    notify((current[kind] ? '已' : '已取消') + label);
  }
}

$('scenario').value = state.scenario;
$('identity').value = state.identity;
$('settings').addEventListener('click', () => setDisclosure('settings', 'controls', $('controls').hidden));
$('scenario').addEventListener('change', event => {
  state.scenario = model.scenario = event.target.value;
  persist();
  renderScenario();
});
$('identity').addEventListener('change', event => {
  state.identity = model.identity = event.target.value;
  $('comment-input').value = '';
  renderReactions();
  renderLocalComments();
  if (persist()) notify('已切换为访客 ' + state.identity);
});
$('map-toggle').addEventListener('click', () => {
  state.manual = true;
  state.expanded = !state.expanded;
  renderMap();
});
$('search-toggle').addEventListener('click', () => {
  const opening = $('search').hidden;
  setDisclosure('search-toggle', 'search', opening);
  if (opening) $('query').focus();
});
$('search').addEventListener('submit', event => {
  event.preventDefault();
  const query = $('query').value.trim().toLowerCase();
  const results = $('search-results');
  if (!query) {
    results.textContent = '请输入关键词。';
    return;
  }
  const matches = [];
  scenarios[state.scenario].comments.forEach(([author, text], index) => {
    if ((author + ' ' + text).toLowerCase().includes(query)) {
      matches.push(button(author + '：' + text, () => jumpToComment(index)));
    }
  });
  results.replaceChildren(element('p', '找到 ' + matches.length + ' 条评论。', 'hint'), ...matches);
});
$('composer').addEventListener('submit', event => {
  event.preventDefault();
  const input = $('comment-input');
  const text = input.value.trim();
  if (text.length < 2 || text.length > 400) {
    notify('请输入 2–400 个字。');
    input.focus();
    return;
  }
  activity().comments.push(text);
  renderLocalComments();
  input.value = '';
  if (persist()) notify('测试评论已保存在当前浏览器。');
});
for (const id of ['like', 'post-like']) $(id).addEventListener('click', () => toggleReaction('liked'));
$('save').addEventListener('click', () => toggleReaction('saved'));
$('show-comments').addEventListener('click', () => show($('discussion')));
$('write').addEventListener('click', () => {
  $('comment-input').focus({ preventScroll: true });
  show($('composer'), 'center');
});
$('top').addEventListener('click', () => show(document.querySelector('.header')));
$('copy').addEventListener('click', async () => {
  if (location.protocol !== 'https:') {
    notify('上线后可复制公开链接。');
    return;
  }
  try {
    await navigator.clipboard.writeText(location.origin + location.pathname);
    notify('已复制演示链接。');
  } catch {
    notify('请从地址栏复制演示链接。');
  }
});

renderScenario();
setInterval(() => {
  if (document.hidden || state.manual || state.expanded || !scenarios[state.scenario].branches) return;
  if ($('post').getBoundingClientRect().bottom <= 100 || $('discussion').getBoundingClientRect().top <= 210) return;
  if (++state.readSeconds >= 5) {
    state.expanded = true;
    renderMap();
  }
}, 1000);
</script>
</body>
</html>
